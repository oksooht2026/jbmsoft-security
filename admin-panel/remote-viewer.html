<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원격 조종 — OKSOOHT Security</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; background: #12121a; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1rem; font-weight: 600; }
    #status { font-size: 0.85rem; color: #8b8b99; }
    #status.ok { color: #00ff88; }
    #status.err { color: #ff2a55; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; position: relative; }
    #screen { max-width: 100%; max-height: 100%; cursor: crosshair; display: block; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8b8b99; font-size: 1.1rem; }
    footer { padding: 8px 16px; background: #12121a; border-top: 1px solid #222; font-size: 0.8rem; color: #8b8b99; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">원격 조종</h1>
    <span id="status">연결 중...</span>
  </header>
  <main id="main">
    <div id="overlay">PC 화면 대기 중...</div>
    <canvas id="screen" style="display:none"></canvas>
  </main>
  <footer>마우스·키보드로 원격 PC를 조종합니다. ESC 두 번으로 창 닫기.</footer>

  <script>
    const params = new URLSearchParams(location.search);
    const pcId = params.get('pcId');
    const pcName = params.get('pcName') || pcId;
    const relayUrl = params.get('relay');
    const SECRET = 'oksooht-remote-2026';

    document.getElementById('title').textContent = `원격 조종 — ${pcName}`;

    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');

    let ws = null;
    let scaleX = 1, scaleY = 1;
    let escCount = 0;

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = cls || '';
    }

    function connect() {
      if (!relayUrl || !pcId) {
        setStatus('릴레이 URL 또는 PC ID 없음', 'err');
        overlay.textContent = '설정 오류 — 관리자 패널에서 Relay URL을 확인하세요.';
        return;
      }

      ws = new WebSocket(relayUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        ws.send(JSON.stringify({ role: 'viewer', pcId, secret: SECRET }));
        setStatus('연결됨 — 화면 수신 대기', 'ok');
      };

      ws.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'error') {
              setStatus(msg.message, 'err');
              overlay.textContent = msg.message;
              overlay.style.display = 'flex';
            }
            if (msg.type === 'agent_offline') {
              setStatus('PC 오프라인', 'err');
              overlay.textContent = '에이전트 연결 끊김';
              overlay.style.display = 'flex';
              canvas.style.display = 'none';
            }
          } catch (_) {}
          return;
        }

        const blob = new Blob([ev.data], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          overlay.style.display = 'none';
          canvas.style.display = 'block';
          const rect = canvas.getBoundingClientRect();
          scaleX = img.width / rect.width;
          scaleY = img.height / rect.height;
          URL.revokeObjectURL(url);
        };
        img.src = url;
        setStatus('스트리밍 중', 'ok');
      };

      ws.onclose = () => {
        setStatus('연결 종료', 'err');
        setTimeout(connect, 5000);
      };

      ws.onerror = () => setStatus('연결 오류', 'err');
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function toCanvasXY(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.round((e.clientX - rect.left) * scaleX),
        y: Math.round((e.clientY - rect.top) * scaleY)
      };
    }

    canvas.addEventListener('mousemove', e => {
      const { x, y } = toCanvasXY(e);
      send({ type: 'mouse_move', x, y });
    });

    canvas.addEventListener('mousedown', e => {
      e.preventDefault();
      const { x, y } = toCanvasXY(e);
      send({ type: 'mouse_click', x, y, button: e.button === 2 ? 'right' : 'left' });
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const { x, y } = toCanvasXY(e);
      send({ type: 'mouse_scroll', x, y, delta: e.deltaY > 0 ? -1 : 1 });
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        escCount++;
        if (escCount >= 2) window.close();
        setTimeout(() => { escCount = 0; }, 800);
        return;
      }
      const mods = [];
      if (e.ctrlKey) mods.push('ctrl');
      if (e.altKey) mods.push('alt');
      if (e.shiftKey) mods.push('shift');
      send({ type: 'key_press', key: e.key, modifiers: mods });
    });

    connect();
  </script>
</body>
</html>
